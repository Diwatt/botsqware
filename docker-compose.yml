services:
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-botsware}
      POSTGRES_USER: ${POSTGRES_USER:-botsware}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-botsware} -d ${POSTGRES_DB:-botsware}"]
      interval: 5s
      timeout: 3s
      retries: 10

  waha:
    restart: always
    image: devlikeapro/waha:arm-2026.3.2
    container_name: botsqware-waha
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media

volumes:
  pgdata:
  waha_sessions:
  waha_media:
