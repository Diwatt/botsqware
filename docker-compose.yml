version: '3.9'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: botsware
      POSTGRES_USER: botsware
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  pgvector:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: botsware
      POSTGRES_USER: botsware
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    depends_on:
      - postgres

volumes:
  pgdata:
